<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ChatBucket Business</title>
<link rel="stylesheet" href="/static/style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
</head>
<body>
  <div class="widget">

    <!-- Header -->
    <header class="widget-header">
      <button class="icon-btn menu-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>

      <div class="header-brand">
        <div class="header-logo">
          <svg viewBox="0 0 48 44" width="40" height="37">
            <path d="M12 2 H36 A9 9 0 0 1 45 11 V25 A9 9 0 0 1 36 34 H20 L11 43 V34 H12 A9 9 0 0 1 3 25 V11 A9 9 0 0 1 12 2 Z" fill="#ffffff"/>
            <circle cx="25" cy="18" r="9" fill="#ffffff"/>
            <circle cx="29.5" cy="14.5" r="7.5" fill="#6d28d9"/>
            <circle cx="22.5" cy="15.5" r="1.1" fill="#6d28d9"/>
            <circle cx="27" cy="15.5" r="1.1" fill="#6d28d9"/>
            <path d="M22 19.5c1.4 1.1 3.6 1.1 5 0" stroke="#6d28d9" stroke-width="1.1" stroke-linecap="round" fill="none"/>
          </svg>
        </div>
        <div class="header-text">
          <div class="header-title">ChatBucket <span>Business</span></div>
          <div class="header-status"><span class="status-dot"></span> Online</div>
        </div>
      </div>

      <button class="icon-btn avatar-btn" aria-label="Account">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      </button>
    </header>

    <!-- Chat body -->
    <main class="widget-body">
      <div class="day-divider"><span>Today</span></div>

      <div id="chatWindow" class="chat-window">
        <div class="message bot-message">
          <div class="avatar bot-avatar">
            <svg viewBox="0 0 40 40" width="30" height="30">
              <circle cx="20" cy="20" r="20" fill="#6d28d9"/>
              <circle cx="18" cy="20" r="9" fill="#ffffff"/>
              <circle cx="22" cy="16.5" r="7.3" fill="#6d28d9"/>
              <circle cx="14.5" cy="17.5" r="1" fill="#6d28d9"/>
              <circle cx="18.5" cy="18" r="1" fill="#6d28d9"/>
              <path d="M14.2 21.3c1.2 1 3.2 1 4.4 0" stroke="#6d28d9" stroke-width="1" stroke-linecap="round" fill="none"/>
            </svg>
          </div>
          <div class="bubble-col">
            <div class="bubble">
              <strong>Hello! 👋</strong><br/>
              Welcome to <span class="brand-link">ChatBucket Business</span>. How can I help you today?
            </div>
            <div class="msg-meta">10:30 AM</div>
          </div>
        </div>
      </div>
    </main>

    <!-- Input -->
    <div class="widget-input-area">
      <div class="input-pill">
        <button class="icon-btn attach-btn" aria-label="Attach" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M21 11.5 12.5 20a4 4 0 0 1-5.7-5.7L15 6a2.7 2.7 0 0 1 3.8 3.8L10.6 18" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
        </button>
        <input id="userInput" type="text" placeholder="Type your message..." autocomplete="off" />
        <button id="sendBtn" class="send-btn" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 12L20 4L13 20L11 13L4 12Z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>

    <!-- Bottom nav -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="chat">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 5h16v11H8l-4 4V5z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>
        <span>Chat</span>
      </button>
      <button class="nav-item" data-tab="history">
        <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
        <span>History</span>
      </button>
      <button class="nav-item" data-tab="analytics">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 20V10M11 20V4M18 20v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Analytics</span>
      </button>
      <button class="nav-item" data-tab="more">
        <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>
        <span>More</span>
      </button>
    </nav>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
